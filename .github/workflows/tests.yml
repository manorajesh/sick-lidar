name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[osc,pointcloud]"
      - run: python -m unittest discover tests -v
      - run: python -m unittest discover apps/pointcloud/tests -v
      - run: lms200 --help
      - run: python apps/pointcloud/pointcloud.py --help
